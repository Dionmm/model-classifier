name: reusable release build

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      publish_release:
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build-attest-publish:
    if: startsWith(inputs.tag_name, 'v')
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: mkdir -p dist sbom
      - name: Build model-router
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "dist/model-router-${GOOS}-${GOARCH}" ./cmd/model-router
      - name: Build model-routerd
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "dist/model-routerd-${GOOS}-${GOARCH}" ./cmd/model-routerd
      - run: go tool govulncheck -mode=binary "dist/model-router-${{ matrix.goos }}-${{ matrix.goarch }}"
      - run: go tool govulncheck -mode=binary "dist/model-routerd-${{ matrix.goos }}-${{ matrix.goarch }}"
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/model-router-${{ matrix.goos }}-${{ matrix.goarch }}
          format: spdx-json
          output-file: sbom/model-router-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/model-routerd-${{ matrix.goos }}-${{ matrix.goarch }}
          format: spdx-json
          output-file: sbom/model-routerd-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/model-router-${{ matrix.goos }}-${{ matrix.goarch }}
          sbom-path: sbom/model-router-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/model-routerd-${{ matrix.goos }}-${{ matrix.goarch }}
          sbom-path: sbom/model-routerd-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-router-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*
            sbom/*

  publish-release:
    if: inputs.publish_release && startsWith(inputs.tag_name, 'v')
    needs: build-attest-publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG_NAME" --notes ""
          gh release upload "$TAG_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
